name: Build HisabPro Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_android:
    name: Compile Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Files
        run: |
          flutter create --platforms=android --org com.hisabpro.moneymanager --project-name hisabpro .
          rm -f test/widget_test.dart

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Build Installable Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HisabPro-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
